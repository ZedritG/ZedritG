name: Generate contribution animation

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/slow-snake.mjs"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#8c6f91&color_dots=#ebedf0,#dbe7df,#a9c4b0,#6ba875,#3f6f50
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#c07a5a&color_dots=#171b21,#283b31,#3f6f50,#6ba875,#8fb596
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Slow the animation rhythm
        env:
          SNAKE_SPEED_FACTOR: "1.4"
        run: node scripts/slow-snake.mjs dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
      - name: Publish generated assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b output
          git add .
          git commit -m "update contribution animation"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin output
