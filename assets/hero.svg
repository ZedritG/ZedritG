<svg
  class="poster"
  width="1200"
  height="420"
  viewBox="0 0 1200 420"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Ronald Rodríguez — Full-Stack Product Engineer</title>
  <desc id="desc">An animated engineering note showing a product moving from a messy workflow through interface, API, data, and field use.</desc>

  <defs>
    <style>
      .poster {
        --paper: #f3efe5;
        --ink: #181818;
        --muted: #676158;
        --rule: #c9c0b1;
        --soft: #e5ded1;
        --accent: #f04f2f;
        --second: #087f78;
      }

      @media (prefers-color-scheme: dark) {
        .poster {
          --paper: #11110f;
          --ink: #f2eee4;
          --muted: #aaa399;
          --rule: #47433d;
          --soft: #24221e;
          --accent: #ff694a;
          --second: #50c2b6;
        }
      }

      .paper { fill: var(--paper); }
      .ink { fill: var(--ink); }
      .muted { fill: var(--muted); }
      .accent { fill: var(--accent); }
      .second { fill: var(--second); }
      .rule { stroke: var(--rule); }
      .soft-stroke { stroke: var(--soft); }
      .ink-stroke { stroke: var(--ink); }
      .accent-stroke { stroke: var(--accent); }
      .second-stroke { stroke: var(--second); }

      .sans { font-family: "Segoe UI", Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: Consolas, "SFMono-Regular", "Liberation Mono", monospace; }

      .flow {
        stroke-dasharray: 8 9;
        animation: dash 12s linear infinite;
      }

      .cursor { animation: blink 1.1s steps(1, end) infinite; }

      .pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 2.2s ease-out infinite;
      }

      .scribble-a { animation: scribble-a 4.2s ease-in-out infinite; }
      .scribble-b { animation: scribble-b 4.2s ease-in-out infinite; }

      @keyframes dash { to { stroke-dashoffset: -170; } }

      @keyframes blink {
        0%, 46% { opacity: 1; }
        47%, 100% { opacity: 0; }
      }

      @keyframes pulse {
        0% { opacity: 0.65; transform: scale(0.75); }
        70%, 100% { opacity: 0; transform: scale(1.7); }
      }

      @keyframes scribble-a {
        0%, 45%, 100% { transform: translate(0, 0); }
        50%, 55% { transform: translate(2px, -1px); }
      }

      @keyframes scribble-b {
        0%, 48%, 100% { transform: translate(0, 0); }
        52%, 58% { transform: translate(-2px, 1px); }
      }

      .static-packet { display: none; }

      @media (prefers-reduced-motion: reduce) {
        .flow, .cursor, .pulse, .scribble-a, .scribble-b { animation: none; }
        .packet { display: none; }
        .static-packet { display: block; }
      }
    </style>

    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" class="soft-stroke" stroke-width="1" opacity="0.34" />
    </pattern>

    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.12" />
    </filter>

    <path
      id="product-loop"
      d="M828 117 C897 84 1047 88 1080 135 C1115 185 1092 288 1033 319 C960 356 815 331 781 274 C754 228 765 151 828 117Z"
    />
  </defs>

  <rect x="1" y="1" width="1198" height="418" rx="18" class="paper rule" stroke-width="2" />
  <rect x="1" y="1" width="1198" height="418" rx="18" fill="url(#paper-grid)" />

  <path d="M52 57H1148" class="rule" stroke-width="1.5" />
  <circle cx="54" cy="30" r="5" class="accent" />
  <text x="70" y="35" class="mono muted" font-size="13" letter-spacing="1.6">ZEDRITG / BUILD NOTE 001</text>
  <text x="1148" y="35" text-anchor="end" class="mono muted" font-size="13">PRODUCT SYSTEMS</text>

  <text x="55" y="107" class="sans ink" font-size="17" font-weight="700" letter-spacing="2.7">RONALD RODRÍGUEZ</text>
  <text x="55" y="164" class="serif ink" font-size="46" font-weight="700">I turn operational mess</text>
  <text x="55" y="218" class="serif ink" font-size="46" font-weight="700">into software people</text>
  <text x="55" y="272" class="serif ink" font-size="46" font-weight="700">can actually use.</text>

  <path d="M57 286C173 278 288 293 405 283" class="accent-stroke" stroke-width="5" stroke-linecap="round" />
  <path d="M60 294C171 288 292 301 399 292" class="accent-stroke" stroke-width="2" stroke-linecap="round" opacity="0.48" />

  <text x="57" y="338" class="mono second" font-size="14" font-weight="700" letter-spacing="1.25">FULL-STACK PRODUCT ENGINEERING</text>
  <text x="57" y="373" class="mono muted" font-size="14">workflow → interface → API → data → field</text>
  <rect x="450" y="358" width="9" height="18" class="cursor accent" rx="1" />

  <path d="M704 80V372" class="rule" stroke-width="1.5" />
  <text x="740" y="91" class="mono muted" font-size="12" letter-spacing="1.4">A PRODUCT IS A LOOP, NOT A HANDOFF</text>

  <use href="#product-loop" class="flow second-stroke" stroke-width="2" fill="none" opacity="0.72" />

  <g class="scribble-a">
    <path d="M765 137C780 125 789 150 803 133C815 118 823 149 839 133" class="ink-stroke" stroke-width="2.2" stroke-linecap="round" />
    <path d="M766 146C783 137 793 156 810 142C823 131 830 151 844 143" class="accent-stroke" stroke-width="1.5" stroke-linecap="round" />
  </g>
  <text x="805" y="172" text-anchor="middle" class="mono muted" font-size="11">MESSY WORKFLOW</text>

  <g filter="url(#shadow)">
    <rect x="991" y="105" width="104" height="72" rx="6" class="paper ink-stroke" stroke-width="2" />
    <path d="M991 123H1095" class="ink-stroke" stroke-width="2" />
    <circle cx="1004" cy="114" r="3" class="accent" />
    <circle cx="1015" cy="114" r="3" class="second" />
    <path d="M1006 139H1059M1006 150H1080M1006 161H1041" class="rule" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="1043" y="195" text-anchor="middle" class="mono muted" font-size="11">INTERFACE</text>

  <g>
    <rect x="1010" y="261" width="78" height="54" rx="7" class="paper second-stroke" stroke-width="2" />
    <text x="1049" y="283" text-anchor="middle" class="mono second" font-size="12" font-weight="700">{ API }</text>
    <path d="M1024 297H1073" class="rule" stroke-width="3" stroke-linecap="round" />
  </g>
  <text x="1049" y="335" text-anchor="middle" class="mono muted" font-size="11">CONTRACT</text>

  <g>
    <ellipse cx="813" cy="279" rx="42" ry="11" class="paper accent-stroke" stroke-width="2" />
    <path d="M771 279V309C771 315 790 320 813 320C836 320 855 315 855 309V279" class="paper accent-stroke" stroke-width="2" />
    <path d="M771 294C771 300 790 305 813 305C836 305 855 300 855 294" class="accent-stroke" stroke-width="1.3" opacity="0.65" />
  </g>
  <text x="813" y="340" text-anchor="middle" class="mono muted" font-size="11">TRUSTED DATA</text>

  <g>
    <circle cx="912" cy="217" r="43" class="soft-stroke" stroke-width="1.5" />
    <text x="912" y="208" text-anchor="middle" class="serif ink" font-size="17" font-style="italic">listen</text>
    <text x="912" y="227" text-anchor="middle" class="serif ink" font-size="17" font-style="italic">ship · learn</text>
  </g>

  <circle cx="828" cy="117" r="12" class="pulse accent" />
  <circle class="packet accent" r="6">
    <animateMotion dur="6.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#product-loop" />
    </animateMotion>
  </circle>
  <circle cx="828" cy="117" r="6" class="static-packet accent" />

  <g class="scribble-b">
    <path d="M1110 233L1137 222M1111 242L1142 244M1107 251L1135 265" class="accent-stroke" stroke-width="2.3" stroke-linecap="round" />
  </g>

  <text x="1147" y="394" text-anchor="end" class="mono muted" font-size="11">DESIGNED IN CODE · BUILT TO MOVE</text>
</svg>
