<svg
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Ronald Rodríguez — Full-Stack Product Engineer</title>
  <desc id="desc">A clean profile card describing Ronald's work across web, APIs, data, and mobile products.</desc>

  <defs>
    <style>
      :root {
        --canvas: #f6f8fa;
        --panel: #ffffff;
        --ink: #1f2328;
        --muted: #59636e;
        --line: #d0d7de;
        --soft: #eaeef2;
        --blue: #0969da;
        --green: #1a7f37;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0d1117;
          --panel: #161b22;
          --ink: #f0f6fc;
          --muted: #9198a1;
          --line: #30363d;
          --soft: #21262d;
          --blue: #58a6ff;
          --green: #3fb950;
        }
      }

      .canvas { fill: var(--canvas); }
      .panel { fill: var(--panel); }
      .ink { fill: var(--ink); }
      .muted { fill: var(--muted); }
      .blue { fill: var(--blue); }
      .green { fill: var(--green); }
      .line { stroke: var(--line); }
      .soft { fill: var(--soft); }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="16" class="canvas line" stroke-width="2" />

  <circle cx="43" cy="35" r="5" class="green" />
  <text x="58" y="40" class="mono muted" font-size="13" font-weight="600" letter-spacing="1.1">AVAILABLE FOR MEANINGFUL PRODUCT WORK</text>
  <text x="1157" y="40" text-anchor="end" class="mono muted" font-size="13">ZEDRITG / GITHUB</text>
  <path d="M42 64H1158" class="line" />

  <text x="43" y="109" class="sans blue" font-size="15" font-weight="700" letter-spacing="1.8">RONALD RODRÍGUEZ</text>
  <text x="43" y="163" class="sans ink" font-size="45" font-weight="700">Full-Stack Product Engineer</text>
  <text x="43" y="208" class="sans ink" font-size="24" font-weight="500">Turning operational complexity into software</text>
  <text x="43" y="239" class="sans ink" font-size="24" font-weight="500">people can rely on every day.</text>

  <rect x="43" y="276" width="87" height="30" rx="15" class="soft" />
  <rect x="139" y="276" width="87" height="30" rx="15" class="soft" />
  <rect x="235" y="276" width="87" height="30" rx="15" class="soft" />
  <rect x="331" y="276" width="103" height="30" rx="15" class="soft" />
  <text x="86.5" y="296" text-anchor="middle" class="mono muted" font-size="12" font-weight="600">WEB</text>
  <text x="182.5" y="296" text-anchor="middle" class="mono muted" font-size="12" font-weight="600">API</text>
  <text x="278.5" y="296" text-anchor="middle" class="mono muted" font-size="12" font-weight="600">DATA</text>
  <text x="382.5" y="296" text-anchor="middle" class="mono muted" font-size="12" font-weight="600">MOBILE</text>

  <rect x="762" y="91" width="396" height="215" rx="12" class="panel line" stroke-width="1.5" />
  <text x="790" y="122" class="mono muted" font-size="12" font-weight="600" letter-spacing="1.2">PRODUCT PRACTICE</text>
  <path d="M790 141H1130" class="line" />

  <text x="790" y="174" class="mono blue" font-size="12" font-weight="700">01</text>
  <text x="830" y="174" class="sans ink" font-size="16" font-weight="600">Understand the workflow</text>
  <text x="790" y="211" class="mono blue" font-size="12" font-weight="700">02</text>
  <text x="830" y="211" class="sans ink" font-size="16" font-weight="600">Shape the product system</text>
  <text x="790" y="248" class="mono blue" font-size="12" font-weight="700">03</text>
  <text x="830" y="248" class="sans ink" font-size="16" font-weight="600">Build across the stack</text>
  <text x="790" y="285" class="mono blue" font-size="12" font-weight="700">04</text>
  <text x="830" y="285" class="sans ink" font-size="16" font-weight="600">Ship evidence, not promises</text>
</svg>
