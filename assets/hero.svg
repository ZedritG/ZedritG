<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="24" x2="1120" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111B33"/>
      <stop offset="0.52" stop-color="#0A1020"/>
      <stop offset="1" stop-color="#11152B"/>
    </linearGradient>
    <linearGradient id="accent" x1="92" y1="94" x2="598" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
