<svg width="720" height="940" viewBox="0 0 720 940" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ronald Rodríguez — mobile profile card</title>
  <desc id="desc">An animated vertical profile card for a full-stack product engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="30" x2="650" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#090B18"/><stop offset=".46" stop-color="#1B123B"/><stop offset="1" stop-color="#080B17"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#8B5CF6" stop-opacity=".58"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent"><stop stop-color="#22D3EE"/><stop offset=".52" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000" flood-opacity=".5"/></filter>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace}
      .star{animation:float 7s ease-in-out infinite}.star:nth-of-type(2n){animation-delay:-3s}.halo{animation:breathe 8s ease-in-out infinite}.status{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}.cursor{animation:blink 1s steps(1) infinite}.line{stroke-dasharray:7 9;animation:dash 10s linear infinite}
      @keyframes float{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-12px);opacity:1}}@keyframes breathe{50%{transform:scale(1.12);opacity:.7}}@keyframes pulse{0%{opacity:.8;transform:scale(.7)}75%,100%{opacity:0;transform:scale(2)}}@keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}@keyframes dash{to{stroke-dashoffset:-190}}
      @media(prefers-reduced-motion:reduce){.star,.halo,.status,.cursor,.line{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="718" height="938" rx="42" fill="url(#bg)" stroke="#44376A" stroke-width="2"/>
  <ellipse class="halo" cx="360" cy="160" rx="270" ry="230" fill="url(#glow)" filter="url(#blur)"/>
  <g fill="#F8FAFC"><circle class="star" cx="77" cy="100" r="2"/><circle class="star" cx="163" cy="57" r="2"/><circle class="star" cx="565" cy="83" r="1.5"/><circle class="star" cx="647" cy="175" r="2"/><circle class="star" cx="86" cy="373" r="1.5"/><circle class="star" cx="622" cy="455" r="2"/></g>

  <g filter="url(#shadow)">
    <circle cx="360" cy="155" r="75" fill="#171A2F" stroke="url(#accent)" stroke-width="4"/>
    <text x="360" y="175" text-anchor="middle" class="sans" fill="#F8FAFC" font-size="52" font-weight="800">RR</text>
    <circle cx="415" cy="205" r="17" fill="#34D399" stroke="#0B0E1B" stroke-width="6"/>
    <circle class="status" cx="415" cy="205" r="13" fill="#34D399"/>
  </g>

  <text x="360" y="276" text-anchor="middle" class="sans" fill="#F8FAFC" font-size="34" font-weight="750">Ronald Rodríguez</text>
  <text x="360" y="313" text-anchor="middle" class="mono" fill="#A78BFA" font-size="18">@ZedritG</text>
  <text x="360" y="358" text-anchor="middle" class="sans" fill="#CBD5E1" font-size="20">Full-Stack Product Engineer</text>
  <text x="360" y="389" text-anchor="middle" class="sans" fill="#94A3B8" font-size="17">Clear products for complex operations.</text>

  <rect x="221" y="423" width="278" height="50" rx="25" fill="url(#accent)"/>
  <text x="360" y="455" text-anchor="middle" class="sans" fill="#070A15" font-size="16" font-weight="800">EXPLORE THE SYSTEM</text>

  <path d="M66 513H654" stroke="#40365F"/>
  <g class="sans" text-anchor="middle">
    <text x="135" y="557" fill="#F8FAFC" font-size="23" font-weight="750">WEB</text><text x="135" y="584" fill="#64748B" font-size="13">interfaces</text>
    <text x="285" y="557" fill="#F8FAFC" font-size="23" font-weight="750">API</text><text x="285" y="584" fill="#64748B" font-size="13">contracts</text>
    <text x="435" y="557" fill="#F8FAFC" font-size="23" font-weight="750">DATA</text><text x="435" y="584" fill="#64748B" font-size="13">systems</text>
    <text x="585" y="557" fill="#F8FAFC" font-size="23" font-weight="750">MOBILE</text><text x="585" y="584" fill="#64748B" font-size="13">field use</text>
  </g>
  <path d="M66 619H654" stroke="#40365F"/>

  <text x="66" y="665" class="mono" fill="#A78BFA" font-size="14" letter-spacing="1.5">PRODUCT LOOP</text>
  <g class="sans">
    <rect x="66" y="695" width="588" height="57" rx="15" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".1"/><text x="91" y="730" fill="#67E8F9" font-size="14" font-weight="700">01</text><text x="137" y="731" fill="#F8FAFC" font-size="18" font-weight="650">Understand the workflow</text>
    <rect x="66" y="766" width="588" height="57" rx="15" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".1"/><text x="91" y="801" fill="#C4B5FD" font-size="14" font-weight="700">02</text><text x="137" y="802" fill="#F8FAFC" font-size="18" font-weight="650">Shape and build the system</text>
    <rect x="66" y="837" width="588" height="57" rx="15" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".1"/><text x="91" y="872" fill="#6EE7B7" font-size="14" font-weight="700">03</text><text x="137" y="873" fill="#F8FAFC" font-size="18" font-weight="650">Ship evidence, then learn</text><rect class="cursor" x="389" y="854" width="9" height="23" rx="2" fill="#EC4899"/></g>
  <path class="line" d="M40 904H680" stroke="url(#accent)" stroke-width="2" opacity=".7"/>
</svg>
