<svg width="720" height="420" viewBox="0 0 720 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Ronald Rodríguez — Full-Stack Product Engineer</title>
  <desc id="desc">A mobile typographic editorial profile banner built on an asymmetric grid.</desc>
  <style>
    .sans{font-family:Arial,Helvetica,sans-serif}.mono{font-family:"Courier New",Consolas,monospace}
  </style>

  <rect width="720" height="420" fill="#EEE9DE"/>
  <rect width="14" height="420" fill="#D65035"/>
  <path d="M42 48H678M42 248H678" stroke="#171A1C"/>

  <g class="mono" fill="#171A1C" font-size="11" font-weight="700" letter-spacing="1.3">
    <text x="42" y="33">ZEDRITG / PROFILE 01</text>
    <text x="678" y="33" text-anchor="end">EC · 2026</text>
  </g>

  <g class="sans">
    <text x="42" y="122" fill="#171A1C" font-size="56" font-weight="800" letter-spacing="-1.5">RONALD</text>
    <text x="38" y="211" fill="#1D4D91" font-size="79" font-weight="800" letter-spacing="-3.5">RODRÍGUEZ</text>
    <rect x="472" y="181" width="77" height="9" fill="#D65035"/>
  </g>

  <rect x="0" y="264" width="720" height="116" fill="#1D4D91"/>
  <g transform="translate(42 291)">
    <text x="0" y="0" class="mono" fill="#B8C7DE" font-size="11" font-weight="700" letter-spacing="1.5">FULL-STACK</text>
    <text x="0" y="39" class="sans" fill="#EEE9DE" font-size="28" font-weight="800">PRODUCT ENGINEER</text>
    <text x="0" y="68" class="mono" fill="#EEE9DE" font-size="11">@ZedritG · Ecuador</text>
    <text x="636" y="68" text-anchor="end" class="mono" fill="#B8C7DE" font-size="11">WEB / API / DATA / MOBILE</text>
  </g>

  <rect y="380" width="720" height="40" fill="#171A1C"/>
  <text x="42" y="405" class="mono" fill="#EEE9DE" font-size="11" font-weight="700" letter-spacing="1.2">WORKFLOW → INTERFACE → API → DATA → FIELD</text>
</svg>
